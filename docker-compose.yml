version: '3.8'

services:
  pcinbox_admin-dev:
    build:
      context: .
      dockerfile: Dockerfile
    command: npm run dev
    ports:
      - "3001:3001"
    volumes:
      - .:/app
      - /app/node_modules
    env_file:
      - .env.local

  pcinbox_admin-qa:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BUILD_CMD: build:qa
    command: npm run start
    ports:
      - "3001:3001"
    env_file:
      - .env.local

  pcinbox_admin-prod:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BUILD_CMD: build:prod
    command: npm start
    ports:
      - "3002:3002"
    env_file:
      - .env.prod
